name: Dedicated performance

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  performance:
    strategy:
      matrix:
        include:
          - {runner: [self-hosted, shell-picker-perf, linux]}
          - {runner: [self-hosted, shell-picker-perf, windows]}
    runs-on: ${{ matrix.runner }}
    env: {SHELL_PICKER_DEDICATED_PERF: 1}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: 1.26.5}
      - run: make performance-dedicated
        env:
          PERFORMANCE_SCENARIOS: navigation-local-only
      - name: Validate performance JSON outputs
        shell: bash
        run: grep -Eq '"status"[[:space:]]*:[[:space:]]*"(qualified|baseline-required)"' performance.json && test -s host-baseline.json && test -s performance.json && go test ./integration -run TestPerformanceJSONOutputs -count=1
        env:
          SHELL_PICKER_PERFORMANCE_OUTPUTS: 1
      - uses: actions/upload-artifact@v4
        with:
          name: performance-${{ runner.os }}
          path: |
            host-baseline.json
            performance.json
