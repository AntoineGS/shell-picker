name: Real fzf

on:
  workflow_dispatch:
    inputs:
      fzf_version:
        required: true
        default: 0.74.1
        type: string
  schedule:
    - cron: '17 3 * * 0'

permissions: {contents: read}

jobs:
  real-fzf:
    strategy: {matrix: {os: [ubuntu-24.04, windows-2025]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: 1.26.5}
      - name: Install official fzf archive
        shell: bash
        env:
          FZF_VERSION: ${{ inputs.fzf_version || '0.74.1' }}
        run: |
          set -euo pipefail
          if [[ ! "$FZF_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'fzf_version must be numeric MAJOR.MINOR.PATCH\n' >&2
            exit 2
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          version_at_least() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            [ "$major" != 0 ] ||
              [ "${#minor}" -gt 2 ] ||
              { [ "${#minor}" -eq 2 ] && [[ "$minor" > 74 ]]; } ||
              { [ "$minor" = 74 ] && [ "$patch" != 0 ]; }
          }
          version_at_least "$version"
          mkdir -p .ci/fzf
          if [ "$RUNNER_OS" = Linux ]; then archive="fzf-${version}-linux_amd64.tar.gz"; else archive="fzf-${version}-windows_amd64.zip"; fi
          curl -fsSL -o .ci/fzf/$archive "https://github.com/junegunn/fzf/releases/download/v${version#v}/$archive"
          curl -fsSL -o .ci/fzf/checksums.txt "https://github.com/junegunn/fzf/releases/download/v${version#v}/fzf_${version#v}_checksums.txt"
          (cd .ci/fzf && sha256sum -c checksums.txt --ignore-missing)
          if [ "$RUNNER_OS" = Linux ]; then tar -xzf .ci/fzf/$archive -C .ci/fzf; else unzip -o .ci/fzf/$archive -d .ci/fzf; fi
      - name: Linux terminal prerequisites
        if: runner.os == 'Linux'
        run: go test ./integration -run TestPlatformPrerequisites -count=1
      - name: Windows pseudo console prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test ./integration -run TestPlatformPrerequisites -count=1
      - shell: bash
        run: SHELL_PICKER_REAL_FZF="$PWD/.ci/fzf/fzf${{ runner.os == 'Windows' && '.exe' || '' }}" go test ./integration -run TestRealFZF -count=1 -v
